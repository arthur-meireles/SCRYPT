<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Estúdio independente de games. Três pessoas, um jogo em desenvolvimento e um diário aberto do processo." />
    <meta name="theme-color" content="#07050d" />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <title>Studio S — estúdio independente de games</title>
    <script>
      // aplica o tema salvo antes do primeiro paint (evita flash)
      try {
        var t = localStorage.getItem('theme')
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
